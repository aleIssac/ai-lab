<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>ConvNetJS · 去噪自编码器演示</title>
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="stylesheet" href="css/style.css">
</head>

<script src="js/jquery-1.8.3.min.js"></script>
<script src="../build/vis.js"></script>
<script src="../build/util.js"></script>
<script src="../build/convnet.js"></script>


<script src="mnist/mnist_labels.js"></script>
<script src="js/autoencoder.js"></script>

<body>
  <div id="wrap">
  <h2 style="text-align: center;">ConvNetJS · 去噪自编码器演示</h2>
  <h1>说明</h1>
  <p>其余演示均为监督学习示例，本演示展示无监督学习：在 MNIST 手写数字上训练一个自编码器。</p>
  <p>自编码器可视为回归任务——网络被要求预测自身输入（即拟合恒等函数）。难点在于网络中部存在只有少数神经元的瓶颈层（默认示例仅 2 个），迫使网络学习有效的低维表示，再由解码器还原原始图像。</p>
  </p>
  <h1>训练状态</h1>
  <div class="divsec" style="270px;">
    <div class="secpart">
      当前图片： <img id="input_image" src=""></img><input id="buttontp" type="submit" value="暂停" onclick="toggle_pause();"/>
      <div id="trainstats"></div>

      <div id="controls">
        学习率：<input name="lri" type="text" maxlength="20" id="lr_input"/>
        <input id="buttonlr" type="submit" value="修改" onclick="change_lr();"/>
        <br />
      </div>

      <input id="buttondj" type="submit" value="导出网络快照（JSON）" onclick="dump_json();"/><br />
      <input id="buttonlfj" type="submit" value="从 JSON 快照导入网络" onclick="load_from_json();"/><br />
      <textarea id="dumpjson"></textarea>
    </div>
    <div class="secpart">
      
      <div>
        损失：<br />
        <canvas id="lossgraph">
        </canvas>
        <br />
        <input id="buttoncg" type="submit" value="清空曲线" onclick="clear_graph();"/>
      </div>

    </div>
    <div>
      <textarea id="newnet" style="width:100%; height:100px;"></textarea><br />
      <input id="buttonnn" type="submit" value="重新载入" onclick="change_net();" style="width:200px; height: 40px;"/>
    </div>

    <div style="margin-top: 1px solid #000; margin-top:20px;">
      <div id="layer_ixes"></div>
      <input id="buttoncycle" type="submit" value="切换所选层中可视化的神经元（多于 2 个时可用）" onclick="cycle();" style="height: 40px;"/>
      <div id="cyclestatus"></div>
      <div style="text-align:center;"><canvas id="embedding" width="500" height="500"></canvas></div>
    </div>

    <div style="clear:both;"></div>
  </div>

  <div class="divsec">
  <h1>网络结构可视化</h1>
    <div id="visnet"></div>
  </div>

  </div>  
</body>
</html>
